# Nginx configuration for Adilisha STEM Labs
# Place this in: /etc/nginx/sites-available/lab.adilishastemlabs.com

server {
    listen 80;
    listen [::]:80;
    server_name lab.adilishastemlabs.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# SSL Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab.adilishastemlabs.com;

    # Root directory for the site
    root /var/www/lab.adilishastemlabs.com/repo;
    index index.html;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/lab.adilishastemlabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.adilishastemlabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Clean URL: /density redirects to density_en.html
    location = /density {
        return 301 $scheme://$host/density/;
    }

    location /density/ {
        alias /var/www/lab.adilishastemlabs.com/repo/density/;
        index density_en.html;
        try_files $uri $uri/ /density/density_en.html;
        
        # Enable CORS
        add_header Access-Control-Allow-Origin *;
    }

    # Clean URL: /models-of-the-hydrogen-atom redirects with trailing slash
    location = /models-of-the-hydrogen-atom {
        return 301 $scheme://$host/models-of-the-hydrogen-atom/;
    }

    location /models-of-the-hydrogen-atom/ {
        alias /var/www/lab.adilishastemlabs.com/repo/models-of-the-hydrogen-atom/;
        index models-of-the-hydrogen-atom_en.html;
        try_files $uri $uri/ /models-of-the-hydrogen-atom/models-of-the-hydrogen-atom_en.html;
        
        # Enable CORS
        add_header Access-Control-Allow-Origin *;
    }

    # Serve all other static files from shared libraries
    location / {
        try_files $uri $uri/ =404;
    }

    # Logging
    access_log /var/log/nginx/lab.adilishastemlabs.com-ssl-access.log;
    error_log /var/log/nginx/lab.adilishastemlabs.com-ssl-error.log;
}
